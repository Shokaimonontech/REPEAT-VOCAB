<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Furigana JLPT N1</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --background-color: #f5f7fa;
            --card-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-top: 30px;
        }

        .quiz-card {
            background: var(--card-color);
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #eef2f5;
            margin-bottom: 20px;
        }

        .kanji-word {
            font-size: 42px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .meaning-hint {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-style: italic;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            text-align: center;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-check {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-next {
            background-color: #34495e;
            color: white;
        }

        /* Kết quả */
        .result-message {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 27px;
        }

        .success { color: var(--success-color); }
        .error { color: var(--error-color); }

        .correct-answer {
            font-size: 16px;
            color: #555;
            margin-top: 5px;
        }

        .progress {
            color: #95a5a6;
            font-size: 14px;
            margin-top: 20px;
        }

        .loading { font-size: 18px; color: #666; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kiểm tra Furigana (Cách đọc)</h2>

        <div id="loading-view" class="loading">Đang kết nối dữ liệu Google Sheets...</div>

        <div id="app-view" style="display: none;">
            <div class="quiz-card">
                <!-- Hiển thị chữ Kanji -->
                <div class="kanji-word" id="lbl-kanji">-</div>
                <!-- Gợi ý ý nghĩa tiếng Việt phía dưới -->
                <div class="meaning-hint" id="lbl-meaning">-</div>

                <!-- Ô nhập Furigana -->
                <div class="input-group">
                    <input type="text" id="txt-answer" placeholder="Nhập cách đọc (Hiragana/Katakana)..." autocomplete="off">
                    <button class="btn-check" id="btn-action" onclick="handleAction()">Kiểm tra</button>
                </div>

                <!-- Vùng hiện đúng/sai -->
                <div class="result-message" id="lbl-result"></div>
                <div class="correct-answer" id="lbl-correct-answer"></div>
            </div>

            <button onclick="shuffleCards()" style="background: #95a5a6; color: white;">Trộn ngẫu nhiên</button>
            <div class="progress" id="lbl-progress">0 / 0</div>
        </div>
    </div>

    <script>
        // THAY ĐƯỜNG LINK CSV CỦA BẠN VÀO ĐÂY
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTy_T9h5patWpbcmmksSOZPsk5dYTUKCAPan9SSME4ReezwI5WJZcsZ_QIQc23D_zcIosPDLc2kkjp6/pub?gid=188188789&single=true&output=csv'; 

        let vocabularyData = [];
        let currentIndex = 0;
        let isAnswered = false; // Trạng thái câu hỏi (Đã trả lời hay chưa)

        async function fetchSheetsData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                vocabularyData = parseCSV(csvText);
                
                if(vocabularyData.length > 0) {
                    document.getElementById('loading-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'block';
                    loadQuestion();
                } else {
                    document.getElementById('loading-view').innerText = 'Không lấy được dữ liệu. Kiểm tra lại file Sheets!';
                }
            } catch (error) {
                document.getElementById('loading-view').innerText = 'Lỗi kết nối mạng!';
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            if (lines.length < 2) return [];
            return lines.slice(1).map(line => {
                const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                const cleanCells = matches.map(cell => cell.replace(/^"|"$/g, '').trim());
                return {
                    word: cleanCells[0] || '',     // Cột 1: Kanji
                    reading: cleanCells[1] || '',  // Cột 2: Cách đọc (Furigana)
                    meaning: cleanCells[2] || ''   // Cột 3: Ý nghĩa
                };
            }).filter(item => item.word && item.reading);
        }

        function loadQuestion() {
            isAnswered = false;
            const item = vocabularyData[currentIndex];
            
            // Hiện đề bài
            document.getElementById('lbl-kanji').innerText = item.word;
            document.getElementById('lbl-meaning').innerText = item.meaning ? `Nghĩa: ${item.meaning}` : 'Không có gợi ý nghĩa';
            
            // Reset ô nhập và thông báo
            const inputField = document.getElementById('txt-answer');
            inputField.value = '';
            inputField.disabled = false;
            inputField.focus();
            
            document.getElementById('lbl-result').innerText = '';
            document.getElementById('lbl-correct-answer').innerText = '';
            
            // Đổi nút thành "Kiểm tra"
            const btn = document.getElementById('btn-action');
            btn.innerText = 'Kiểm tra';
            btn.className = 'btn-check';

            // Cập nhật tiến độ
            document.getElementById('lbl-progress').innerText = `Câu: ${currentIndex + 1} / ${vocabularyData.length}`;
        }

        function handleAction() {
            if (!isAnswered) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('txt-answer').value.trim().toLowerCase();
            const correctAnswer = vocabularyData[currentIndex].reading.trim().toLowerCase();
            
            const resultLbl = document.getElementById('lbl-result');
            const inputField = document.getElementById('txt-answer');
            
            if(!userAnswer) {
                alert('Vui lòng nhập cách đọc trước!');
                return;
            }

            isAnswered = true;
            inputField.disabled = true;

            // Kiểm tra đáp án (Bỏ qua khoảng trắng thừa)
            if (userAnswer === correctAnswer) {
                resultLbl.innerText = '🎉 CHÍNH XÁC!';
                resultLbl.className = 'result-message success';
            } else {
                resultLbl.innerText = '❌ SAI MẤT RỒI!';
                resultLbl.className = 'result-message error';
                document.getElementById('lbl-correct-answer').innerText = `Đáp án đúng là: ${vocabularyData[currentIndex].reading}`;
            }

            // Đổi trạng thái nút thành "Tiếp theo"
            const btn = document.getElementById('btn-action');
            btn.innerText = 'Tiếp theo';
            btn.className = 'btn-next';
        }

        function nextQuestion() {
            if (currentIndex < vocabularyData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert('Chúc mừng! Bạn đã hoàn thành hết bộ từ vựng.');
                currentIndex = 0;
                loadQuestion();
            }
        }

        function shuffleCards() {
            vocabularyData.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            loadQuestion();
        }

        // Hỗ trợ bấm nút Enter để Kiểm tra / Qua câu tiếp
        document.getElementById('txt-answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleAction();
            }
        });

        window.onload = fetchSheetsData;
    </script>
</body>
</html>
