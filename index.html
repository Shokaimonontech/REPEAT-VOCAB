<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập Furigana JLPT N1</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --background-color: #f5f7fa;
            --card-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-top: 30px;
        }

        .quiz-card {
            background: var(--card-color);
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 2px solid #eef2f5;
            margin-bottom: 20px;
        }

        .kanji-word {
            font-size: 42px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .meaning-hint {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-style: italic;
            white-space: pre-line; /* Giúp hiển thị xuống hàng nếu cột D/E có xuống hàng */
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            outline: none;
            text-align: center;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-check {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-next {
            background-color: #34495e;
            color: white;
        }

        /* Kết quả */
        .result-message {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            min-height: 27px;
        }

        .success { color: var(--success-color); }
        .error { color: var(--error-color); }

        .correct-answer {
            font-size: 16px;
            color: #555;
            margin-top: 5px;
        }

        .progress {
            color: #95a5a6;
            font-size: 14px;
            margin-top: 20px;
        }

        .loading { font-size: 18px; color: #666; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kiểm tra Furigana (Cách đọc)</h2>

        <div id="loading-view" class="loading">Đang kết nối dữ liệu Google Sheets...</div>

        <div id="app-view" style="display: none;">
            <div class="quiz-card">
                <div class="kanji-word" id="lbl-kanji">-</div>
                <div class="meaning-hint" id="lbl-meaning">-</div>

                <div class="input-group">
                    <input type="text" id="txt-answer" placeholder="Nhập cách đọc (Hiragana)..." autocomplete="off">
                    <button class="btn-check" id="btn-action" onclick="handleAction()">Kiểm tra</button>
                </div>

                <div class="result-message" id="lbl-result"></div>
                <div class="correct-answer" id="lbl-correct-answer"></div>
            </div>

            <button onclick="shuffleCards()" style="background: #95a5a6; color: white;">Trộn ngẫu nhiên</button>
            <div class="progress" id="lbl-progress">0 / 0</div>
        </div>
    </div>

    <script>
        // Đã cập nhật link CSV chính xác từ Google Sheets của bạn
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTy_T9h5patWpbcmmksSOZPsk5dYTUKCAPan9SSME4ReezwI5WJZcsZ_QIQc23D_zcIosPDLc2kkjp6/pub?gid=188188789&single=true&output=csv'; 

        let vocabularyData = [];
        let currentIndex = 0;
        let isAnswered = false; 

        async function fetchSheetsData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                vocabularyData = parseCSV(csvText);
                
                if(vocabularyData.length > 0) {
                    document.getElementById('loading-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'block';
                    loadQuestion();
                } else {
                    document.getElementById('loading-view').innerText = 'Không lấy được dữ liệu. Kiểm tra lại file Sheets!';
                }
            } catch (error) {
                document.getElementById('loading-view').innerText = 'Lỗi kết nối mạng hoặc link Sheets sai cấu trúc!';
            }
        }

        // Hàm phân tách CSV chuẩn, xử lý được cả trường hợp ô dữ liệu chứa dấu phẩy ẩn trong ngoặc kép ""
        function parseCSV(text) {
            let lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];
                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') lines.push(row);
            if (lines.length < 2) return [];

            // Bỏ hàng tiêu đề (index 0) và bắt đầu phân tích từ hàng thứ 2
            return lines.slice(1).map(cells => {
                const cleanCells = cells.map(cell => cell.trim());
                return {
                    colA: cleanCells[0] || '',  // Cột A: Kanji
                    colB: cleanCells[1] || '',  // Cột B: Cách đọc Hiragana
                    colD: cleanCells[3] || '',  // Cột D: Thông tin hiển thị mặt trước
                    colE: cleanCells[4] || ''   // Cột E: Thông tin hiển thị mặt sau
                };
            }).filter(item => item.colA && item.colB); // Bắt buộc phải có Kanji và Cách đọc
        }

        // Hàm lọc sạch: Loại bỏ hoàn toàn dấu ngoặc vuông [...] và nội dung bên trong nó
        function cleanHiragana(text) {
            return text.replace(/\[.*?\]/g, '').trim().toLowerCase();
        }

        function loadQuestion() {
            isAnswered = false;
            const item = vocabularyData[currentIndex];
            
            // Mặt trước: Hiển thị dữ liệu của Cột A và Cột D
            document.getElementById('lbl-kanji').innerText = item.colA;
            document.getElementById('lbl-meaning').innerText = item.colD ? item.colD : '(Trống dữ liệu cột D)';
            
            // Khởi tạo lại ô nhập và thông báo ẩn
            const inputField = document.getElementById('txt-answer');
            inputField.value = '';
            inputField.disabled = false;
            inputField.focus();
            
            document.getElementById('lbl-result').innerText = '';
            document.getElementById('lbl-correct-answer').innerText = '';
            
            // Thiết lập trạng thái nút về trạng thái kiểm tra
            const btn = document.getElementById('btn-action');
            btn.innerText = 'Kiểm tra';
            btn.className = 'btn-check';

            // Hiển thị tiến độ câu hỏi hiện tại
            document.getElementById('lbl-progress').innerText = `Câu: ${currentIndex + 1} / ${vocabularyData.length}`;
        }

        function handleAction() {
            if (!isAnswered) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }

        function checkAnswer() {
            const item = vocabularyData[currentIndex];
            const inputField = document.getElementById('txt-answer');
            
            const rawUserAnswer = inputField.value;
            // Làm sạch câu trả lời người dùng và đáp án cột B (bỏ dấu ngoặc vuông để so sánh)
            const cleanUser = cleanHiragana(rawUserAnswer);
            const cleanCorrect = cleanHiragana(item.colB);
            
            if(!rawUserAnswer.trim()) {
                alert('Vui lòng nhập cách đọc trước!');
                return;
            }

            isAnswered = true;
            inputField.disabled = true;

            // KHI LẬT MẶT SAU: Thay đổi nội dung hiển thị từ Cột D sang Cột E
            document.getElementById('lbl-meaning').innerText = item.colE ? item.colE : '(Trống dữ liệu cột E)';

            const resultLbl = document.getElementById('lbl-result');
            
            // Thực hiện đối chiếu chuỗi Hiragana thuần
            if (cleanUser === cleanCorrect) {
                resultLbl.innerText = '🎉 CHÍNH XÁC!';
                resultLbl.className = 'result-message success';
            } else {
                resultLbl.innerText = '❌ SAI MẤT RỒI!';
                resultLbl.className = 'result-message error';
                // Hiện đáp án gốc chứa cả dấu ngoặc (nếu có) từ cột B để người học dễ so sánh và ghi nhớ cấu trúc từ
                document.getElementById('lbl-correct-answer').innerText = `Đáp án đúng là: ${item.colB}`;
            }

            // Chuyển nút bấm sang trạng thái qua câu tiếp
            const btn = document.getElementById('btn-action');
            btn.innerText = 'Tiếp theo';
            btn.className = 'btn-next';
        }

        function nextQuestion() {
            if (currentIndex < vocabularyData.length - 1) {
                currentIndex++;
                loadQuestion();
            } else {
                alert('Chúc mừng! Bạn đã hoàn thành xong bộ từ vựng hiện tại.');
                currentIndex = 0;
                loadQuestion();
            }
        }

        function shuffleCards() {
            vocabularyData.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            loadQuestion();
        }

        // Kích hoạt phím Enter để thao tác nhanh mà không cần click chuột
        document.getElementById('txt-answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleAction();
            }
        });

        window.onload = fetchSheetsData;
    </script>
</body>
</html>
