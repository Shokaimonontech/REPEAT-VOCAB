<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Ôn tập Từ vựng JLPT N1</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --background-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        /* Flashcard Styles */
        .card-container {
            perspective: 1000px;
            margin: 40px auto;
            width: 100%;
            height: 250px;
            cursor: pointer;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            background: var(--card-color);
            padding: 20px;
            box-sizing: border-box;
        }

        .front {
            border: 2px solid var(--primary-color);
        }

        .back {
            transform: rotateY(180deg);
            background-color: #eef5fc;
            border: 2px dashed var(--primary-color);
        }

        .word { font-size: 36px; font-weight: bold; margin-bottom: 10px; }
        .reading { font-size: 20px; color: #666; }
        .meaning { font-size: 24px; color: #2c3e50; font-weight: 500; }
        .example { font-size: 16px; color: #555; margin-top: 15px; font-style: italic; }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #357abd; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }

        .progress { margin-top: 15px; color: #777; font-size: 14px; }
        .loading { font-size: 18px; color: #666; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>JLPT N1 Vocabulary Flashcards</h1>
        
        <div id="loading-view" class="loading">Đang tải dữ liệu từ Google Sheets...</div>

        <div id="app-view" style="display: none;">
            <div class="card-container" onclick="flipCard()">
                <div class="flashcard" id="card">
                    <div class="front">
                        <div class="word" id="lbl-word">-</div>
                        <div class="reading" id="lbl-reading">-</div>
                    </div>
                    <div class="back">
                        <div class="meaning" id="lbl-meaning">-</div>
                        <div class="example" id="lbl-example">-</div>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="btn-prev" onclick="prevCard()">Trước</button>
                <button onclick="shuffleCards()">Trộn bài</button>
                <button id="btn-next" onclick="nextCard()">Tiếp theo</button>
            </div>

            <div class="progress" id="lbl-progress">0 / 0</div>
        </div>
    </div>

    <script>
        // THAY ĐƯỜNG LINK CSV CỦA BẠN VÀO ĐÂY
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTy_T9h5patWpbcmmksSOZPsk5dYTUKCAPan9SSME4ReezwI5WJZcsZ_QIQc23D_zcIosPDLc2kkjp6/pub?gid=188188789&single=true&output=csv'; 

        let vocabularyData = [];
        let currentIndex = 0;

        // Hàm tải và xử lý dữ liệu CSV
        async function fetchSheetsData() {
            try {
                const response = await fetch(SHEET_CSV_URL);
                const csvText = await response.text();
                vocabularyData = parseCSV(csvText);
                
                if(vocabularyData.length > 0) {
                    document.getElementById('loading-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'block';
                    updateCard();
                } else {
                    document.getElementById('loading-view').innerText = 'Không tìm thấy dữ liệu từ vựng. Vui lòng kiểm tra lại cấu trúc file!';
                }
            } catch (error) {
                console.error(error);
                document.getElementById('loading-view').innerText = 'Lỗi kết nối dữ liệu. Đảm bảo bạn đã xuất bản file Sheets ở dạng CSV!';
            }
        }

        // Hàm chuyển đổi dữ liệu CSV thô thành mảng Object
        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line);
            if (lines.length < 2) return [];
            
            // Lấy hàng tiêu đề (Cột 1: Từ, Cột 2: Cách đọc, Cột 3: Ý nghĩa, Cột 4: Ví dụ)
            const headers = lines[0].split(',');
            
            return lines.slice(1).map(line => {
                // Xử lý dấu phẩy nằm trong dấu ngoặc kép nếu có
                const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                const cleanCells = matches.map(cell => cell.replace(/^"|"$/g, '').trim());
                
                return {
                    word: cleanCells[0] || '',
                    reading: cleanCells[1] || '',
                    meaning: cleanCells[2] || '',
                    example: cleanCells[3] || ''
                };
            }).filter(item => item.word); // Bỏ hàng trống không có Từ vựng
        }

        function updateCard() {
            const card = document.getElementById('card');
            card.classList.remove('flipped'); // Reset mặt trước khi đổi từ
            
            setTimeout(() => {
                const item = vocabularyData[currentIndex];
                document.getElementById('lbl-word').innerText = item.word;
                document.getElementById('lbl-reading').innerText = item.reading ? `(${item.reading})` : '';
                document.getElementById('lbl-meaning').innerText = item.meaning;
                document.getElementById('lbl-example').innerText = item.example ? `Ví dụ: ${item.example}` : '';
                
                document.getElementById('lbl-progress').innerText = `${currentIndex + 1} / ${vocabularyData.length}`;
                document.getElementById('btn-prev').disabled = currentIndex === 0;
                document.getElementById('btn-next').disabled = currentIndex === vocabularyData.length - 1;
            }, 150);
        }

        function flipCard() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function nextCard() {
            if (currentIndex < vocabularyData.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function shuffleCards() {
            vocabularyData.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            updateCard();
        }

        // Chạy ứng dụng khi tải trang
        window.onload = fetchSheetsData;
    </script>
</body>
</html>
